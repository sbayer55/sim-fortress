[package]
name = "sim-fortress"
version = "0.1.0"
edition = "2021"
description = "Static UI prototypes for Sim Fortress, a terminal predator/prey/evolution simulation"

[dependencies]
ratatui = "0.30"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
postcard = { version = "1", features = ["alloc"] }
toml_edit = "0.22"
serde-big-array = "0.5"

[profile.dev]
opt-level = 1
