msrv = "1.85"                          # set to your actual minimum
avoid-breaking-exported-api = false    # true once you have real semver users

# --- size / complexity thresholds ---
cognitive-complexity-threshold = 15
too-many-lines-threshold = 80
too-many-arguments-threshold = 6
type-complexity-threshold = 250
excessive-nesting-threshold = 5
single-char-binding-names-threshold = 4
max-fn-params-bools = 2
max-struct-bools = 3

# --- memory / layout ---
enum-variant-size-threshold = 256      # boxes fat variants
large-error-threshold = 128            # keep Result<_, E> small
trivial-copy-size-limit = 16           # pass small Copy types by value
pass-by-value-size-limit = 256
future-size-threshold = 16384          # catches accidentally huge async fns
stack-size-threshold = 262144

# --- test ergonomics: unwrap/expect/panic are fine in tests ---
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true

disallowed-names = ["foo", "bar", "baz", "tmp", "temp"]